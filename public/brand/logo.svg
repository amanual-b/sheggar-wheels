<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <!-- Background is transparent -->
  <g fill="#6d28d9" stroke="#6d28d9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    
    <!-- Cart Body / Basket -->
    <path d="M 330 180 
             L 630 180 
             A 20 20 0 0 1 650 200
             L 620 320 
             A 30 30 0 0 1 590 350
             L 420 350 
             A 40 40 0 0 1 380 310
             L 350 200
             A 10 10 0 0 1 360 190
             Z" 
          fill="#6d28d9" />
          
    <!-- Handle -->
    <path d="M 350 210 
             L 320 150 
             A 15 15 0 0 0 305 135 
             L 280 135 
             A 15 15 0 0 0 265 150 
             L 265 160 
             A 15 15 0 0 0 280 175 
             L 300 175 
             Z" 
          fill="#6d28d9" />

    <!-- Connecting Chassis Axle -->
    <rect x="380" y="340" width="220" height="25" rx="5" fill="#6d28d9" />
  </g>

  <!-- Left Big Wheel -->
  <g transform="translate(350, 420)">
    <!-- Outer Tire -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#6d28d9" stroke-width="24" />
    <circle cx="0" cy="0" r="92" fill="none" stroke="#ffffff" stroke-width="6" />
    <!-- Inner Rim Outer Edge -->
    <circle cx="0" cy="0" r="84" fill="none" stroke="#6d28d9" stroke-width="10" />
    <!-- Center Hub -->
    <circle cx="0" cy="0" r="26" fill="#6d28d9" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
    <!-- Spokes (8 Spokes) -->
    <g stroke="#6d28d9" stroke-width="14" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="-80" />
      <line x1="0" y1="22" x2="0" y2="80" />
      <line x1="-22" y1="0" x2="-80" y2="0" />
      <line x1="22" y1="0" x2="80" y2="0" />
      <line x1="-15.5" y1="-15.5" x2="-56.5" y2="-56.5" />
      <line x1="15.5" y1="15.5" x2="56.5" y2="56.5" />
      <line x1="15.5" y1="-15.5" x2="56.5" y2="-56.5" />
      <line x1="-15.5" y1="15.5" x2="-56.5" y2="56.5" />
    </g>
  </g>

  <!-- Right Big Wheel -->
  <g transform="translate(610, 420)">
    <!-- Outer Tire -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#6d28d9" stroke-width="24" />
    <circle cx="0" cy="0" r="92" fill="none" stroke="#ffffff" stroke-width="6" />
    <!-- Inner Rim Outer Edge -->
    <circle cx="0" cy="0" r="84" fill="none" stroke="#6d28d9" stroke-width="10" />
    <!-- Center Hub -->
    <circle cx="0" cy="0" r="26" fill="#6d28d9" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
    <!-- Spokes (8 Spokes) -->
    <g stroke="#6d28d9" stroke-width="14" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="-80" />
      <line x1="0" y1="22" x2="0" y2="80" />
      <line x1="-22" y1="0" x2="-80" y2="0" />
      <line x1="22" y1="0" x2="80" y2="0" />
      <line x1="-15.5" y1="-15.5" x2="-56.5" y2="-56.5" />
      <line x1="15.5" y1="15.5" x2="56.5" y2="56.5" />
      <line x1="15.5" y1="-15.5" x2="56.5" y2="-56.5" />
      <line x1="-15.5" y1="15.5" x2="-56.5" y2="56.5" />
    </g>
  </g>
</svg>
